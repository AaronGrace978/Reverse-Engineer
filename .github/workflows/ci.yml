name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Real Electron smoke test
        run: npm run test:desktop
      - name: Package Linux application
        run: npm run dist:dir
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-evidence
          path: test-results/
