name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Real Electron smoke test
        run: npm run test:desktop
      - name: Package Linux application
        run: npm run dist:dir
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-evidence
          path: test-results/
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test native Windows application
        run: npm run test:desktop
      - name: Package Windows application
        run: npx electron-builder --win --x64 --dir --publish never
      - name: Test packaged Windows application
        shell: pwsh
        run: |
          $env:REVERSE_ENGINEER_EXECUTABLE = (Resolve-Path 'release/win-unpacked/Reverse Engineer.exe').Path
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows application failed its smoke test.' }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-test-evidence
          path: test-results/
